{% extends "admin/base_site.html" %}

{% block content %}
<div id="content-main">
    <h1>{{ title }}</h1>

    <p>
        Integração:
        <strong>{{ integration.name }}</strong>
        ({{ integration.code }})
    </p>

    <form method="post" novalidate>
        {% csrf_token %}

        {{ form.as_p }}

        <div class="submit-row">
            <input
                type="submit"
                value="Salvar credencial"
                class="default"
            >

            <a
                href="{% url 'admin:integrations_integration_change' integration.id %}"
                class="button"
            >
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
