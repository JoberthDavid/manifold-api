[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manifold-api"
version = "0.1.0"
description = "Central orchestration and administration API for the Manifold platform."
requires-python = ">=3.10,<3.13"
dependencies = [
    "Django>=5.2,<6.0",
    "djangorestframework>=3.18,<4.0",
    "python-dotenv>=1.2,<2.0",
]

[tool.setuptools]
include-package-data = true
